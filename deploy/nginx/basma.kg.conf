# Basma Service — basma.kg (Django в Docker, /root/BasmaKG, web на 127.0.0.1:8090)
# Установка:
#   cp deploy/nginx/basma.kg.conf /etc/nginx/sites-available/basma.kg
#   ln -s /etc/nginx/sites-available/basma.kg /etc/nginx/sites-enabled/basma.kg
#   nginx -t && systemctl reload nginx
#   (блоки «managed by Certbot» — результат certbot --nginx -d basma.kg -d www.basma.kg)
#
# Общие лимиты сервера (perip, login, connip) — в /etc/nginx/conf.d/ratelimit.conf.

# Форма заявок: 10 в минуту с IP (+ всплеск 5). Сверху ещё лимит внутри Django.
limit_req_zone $binary_remote_addr zone=basma_lead:10m rate=10r/m;

server {
    server_name basma.kg www.basma.kg;

    client_max_body_size 15m;

    # Заголовки безопасности для страниц ставит Django (SecurityMiddleware),
    # здесь — только для статики и медиа, чтобы не было дублей.

    # --- сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/manifest+json image/svg+xml;

    # --- сканеры WordPress/PHP: старого сайта больше нет
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|sql|bak)$ { return 404; }
    location ~* ^/(wp-admin|wp-includes|wp-content|xmlrpc) { return 404; }

    # --- статика: имена с хешем (ManifestStaticFilesStorage) — кэш на год
    location /static/ {
        alias /root/BasmaKG/app/staticfiles/;
        expires 365d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # --- макеты клиентов: только через админку (Django проверяет права)
    location ^~ /media/leads/ { return 404; }

    location /media/ {
        alias /root/BasmaKG/app/media/;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # --- форма заявок: отдельный жёсткий лимит
    location ~ ^/(ky/)?lead/$ {
        limit_req zone=basma_lead burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/basma.kg/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/basma.kg/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.basma.kg) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = basma.kg) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name basma.kg www.basma.kg;
    return 404; # managed by Certbot




}